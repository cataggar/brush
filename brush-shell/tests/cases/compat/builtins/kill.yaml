name: "Builtins: kill"
cases:
  - name: "kill -l"
    ignore_stderr: true
    stdin: |
      for i in $(seq 1 31); do kill -l $i; done
      for i in $(kill -l | sed -e "s/[[:digit:]]*)//g"); do echo $i; done
      # invalid option
      kill -l 9999
      kill -l HUP
      kill -l iNt
      kill -l int
      kill -l SIGHUP
      kill -l EXIT

  - name: "kill -l signal-derived exit statuses"
    ignore_stderr: true
    stdin: |
      for status in 129 137; do
        printf '%s=%s\n' "$status" "$(kill -l "$status")"
      done
      kill -l 128
      printf '128:%s\n' "$?"

      if test "$(uname -s)" = Linux; then
        min=$(kill -l RTMIN)
        max=$(kill -l RTMAX)
        for number in "$min" "$((min + 1))" "$((max - 1))" "$max"; do
          status=$((128 + number))
          printf '%s=%s\n' "$status" "$(kill -l "$status")"
        done
      fi

  - name: "kill -l realtime signals"
    ignore_stderr: true
    stdin: |
      if test "$(uname -s)" != Linux; then
        echo "realtime signals unsupported"
        exit
      fi

      min=$(kill -l RTMIN)
      max=$(kill -l RTMAX)
      span=$((max - min))

      for signal in RTMIN RTMIN+0 RTMIN+1 RTMIN+$span RTMAX-1 RTMAX; do
        printf '%s=%s\n' "$signal" "$(kill -l "$signal")"
      done
      for number in "$min" "$((min + 1))" "$((max - 1))" "$max"; do
        printf '%s=%s\n' "$number" "$(kill -l "$number")"
      done

      for signal in RTMIN+$((span + 1)) RTMAX-0 RTMAX-$span; do
        kill -l "$signal" >/dev/null
        printf '%s:%s\n' "$signal" "$?"
      done
      kill -l "$((max + 1))" >/dev/null
      printf '%s:%s\n' "$((max + 1))" "$?"

  - name: "kill -s"
    stdin: |
      kill -s USR1 $$

  - name: "kill -n"
    stdin: |
      kill -n 9 $$

  - name: "kill -sigspec"
    stdin: |
      kill -USR1 $$

  - name: "kill -sigspec (numeric)"
    stdin: |
      kill -9 $$

  - name: "kill -sigspec (numeric, full name resolution)"
    stdin: |
      kill -l $(kill -l KILL)

  - name: "kill -sigspec (numeric, invalid)"
    ignore_stderr: true
    stdin: |
      kill -9999 $$
      echo "exit code: $?"
